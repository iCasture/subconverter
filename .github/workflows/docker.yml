name: Publish Docker Images

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ build/master ]
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOCKERHUB_IMAGE: icasture/subconverter
  GHCR_IMAGE: ghcr.io/icasture/subconverter
  PUBLISH_BRANCH_REF: refs/heads/build/master
  DOCKER_METADATA_SHORT_SHA_LENGTH: '7'

jobs:
  build_platform_images:
    name: Build and push ${{ matrix.platform }} to Docker Hub & GHCR
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/build/master'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/386
            runner: ubuntu-latest
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare digest artifact name
        id: digest_artifact
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: echo "name=image-digest-${TARGET_PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: image_metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == env.PUBLISH_BRANCH_REF }}
            type=sha,format=short,prefix=git-,enable=${{ github.ref == env.PUBLISH_BRANCH_REF }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get source commit for development version
        if: github.ref == env.PUBLISH_BRANCH_REF
        id: source_commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build platform image and push to Docker Hub & GHCR by digest
        id: platform_image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: scripts/Dockerfile
          labels: ${{ steps.image_metadata.outputs.labels }}
          build-args: |
            SHA=${{ steps.source_commit.outputs.short_sha }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Save platform image digest
        env:
          IMAGE_DIGEST: ${{ steps.platform_image.outputs.digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/image-digests
        run: |
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${IMAGE_DIGEST#sha256:}"

      - name: Upload platform image digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.digest_artifact.outputs.name }}
          path: ${{ runner.temp }}/image-digests/*
          if-no-files-found: error
          retention-days: 1

  publish_multiarch_images:
    name: Publish multi-platform image to ${{ matrix.name }}
    needs: build_platform_images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Docker Hub
            registry: docker.io
            image_env: DOCKERHUB_IMAGE
          - name: GHCR
            registry: ghcr.io
            image_env: GHCR_IMAGE
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/image-digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate registry image metadata
        id: image_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == env.PUBLISH_BRANCH_REF }}
            type=sha,format=short,prefix=git-,enable=${{ github.ref == env.PUBLISH_BRANCH_REF }}

      - name: Log in to Docker Hub
        if: matrix.registry == 'docker.io'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: matrix.registry == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        working-directory: ${{ runner.temp }}/image-digests
        env:
          REGISTRY_IMAGE: ${{ env[matrix.image_env] }}
          IMAGE_TAGS: ${{ steps.image_metadata.outputs.tags }}
        run: |
          tag_args=()

          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"

          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "::error::No image tags were generated for this Git reference."
            exit 1
          fi

          image_sources=()
          shopt -s nullglob

          for digest_file in *; do
            if [[ ! -f "$digest_file" || ! "$digest_file" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid platform image digest: $digest_file"
              exit 1
            fi
            image_sources+=("$REGISTRY_IMAGE@sha256:$digest_file")
          done

          if [[ ${#image_sources[@]} -eq 0 ]]; then
            echo "::error::No platform image digests were found."
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${image_sources[@]}"

      - name: Inspect published multi-platform image
        env:
          REGISTRY_IMAGE: ${{ env[matrix.image_env] }}
          IMAGE_VERSION: ${{ steps.image_metadata.outputs.version }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$IMAGE_VERSION"

# Repository / Actions settings requirements:
#
# 1. Settings -> Actions -> General -> Workflow permissions:
#    - Enable "Allow GitHub Actions to create and approve pull requests" so the
#      workflow's GITHUB_TOKEN can approve PRs opened by Dependabot.
#
# 2. Settings -> General -> Pull Requests:
#    - Enable "Allow auto-merge" so `gh pr merge --auto` can queue a merge while
#      required checks or reviews are pending.
#    - Enable "Allow squash merging" because the workflow uses `--squash`.
#
# 3. Configure the GitHub App used to request auto-merge:
#    - In the account's Settings -> Developer settings -> GitHub Apps, select
#      "New GitHub App" and configure these fields:
#      - "GitHub App name": Enter a unique name, such as
#        "iCasture Dependabot Auto Merge".
#      - "Homepage URL": Enter the owning account's GitHub profile URL, such as
#        https://github.com/iCasture.
#      - "Callback URL" and "Setup URL": Leave both blank.
#      - "Request user authorization (OAuth) during installation" and
#        "Enable Device Flow": Leave both unchecked.
#      - "Webhook" -> "Active": Uncheck "Active".
#      - "Permissions" -> "Repository permissions": Set "Contents",
#        "Pull requests", and "Workflows" to "Read & write". Workflows access
#        is needed to merge updates to files under .github/workflows/. The App
#        follows the repository's merge rules.
#      - "Where can this GitHub App be installed?": Select "Only on this
#        account" for repositories under the App's owning account. Select
#        "Any account" if the repositories have different owners.
#      - Click "Create GitHub App".
#    - Install the App on each repository that will use it:
#      - In the App settings, click "Install App", then click "Install" next
#        to the repository owner's account.
#      - Choose "Only select repositories" and select the intended repositories
#        for that owner. If the repositories have different owners, repeat the
#        installation for each owner and select their intended repositories.
#      - Review the permissions and click "Install". If the App is already
#        installed, go to "GitHub Settings" -> "Integrations" -> "Applications"
#        -> "Installed GitHub Apps" -> "Configure" and add any
#        additional repositories under "Repository access", then save.
#    - In the App settings, copy the value labeled "Client ID". The numeric
#      "App ID" is a separate identifier. This workflow uses "Client ID".
#    - In the App settings, go to "Credentials" -> "Key pairs" and click
#      "New key" to download the private key as a .pem file.
#    - In each repository using the App, open Settings -> Secrets and variables
#      -> Actions. Under Variables, create the repository variable
#      DEPENDABOT_MERGE_APP_CLIENT_ID with the App's Client ID. Under Secrets,
#      create the repository secret DEPENDABOT_MERGE_APP_PRIVATE_KEY with the
#      full PEM text, including the BEGIN and END lines and original line breaks.
#      Repositories sharing one App can use the same Client ID and PEM.
#    - After validation and approval, the workflow creates a short-lived token
#      scoped to the current repository. Only the merge command uses this token.
#      The App's private key can issue tokens for repositories the App can access.
#      If repositories need independent permissions, create a separate App for
#      each repository and install each App only on its own repository.
#    - https://docs.github.com/en/apps/using-github-apps/installing-your-own-github-app
#    - https://github.com/actions/create-github-app-token
#    - https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
#
# 4. If using an organization repository:
#    - The organization must allow workflows to approve pull requests.
#      Organization policy takes precedence over the repository setting.
#
# 5. Branch protection rules or rulesets for the default branch:
#
#    - If "Require status checks to pass before merging" is enabled, GitHub
#      waits for all selected checks. Without required checks, GitHub can
#      merge while optional CI is pending or failing if other rules are met.
#      Independently, this workflow waits for the build.yml PR run to succeed
#      before approving an eligible Dependabot PR.
#
#    - If approval requirements are configured under "Require a pull request
#      before merging", GitHub waits until all applicable review requirements
#      are met. This workflow submits one approval for the event's head commit
#      before requesting squash auto-merge, even when GitHub requires no
#      approvals. Additional approvals or Code Owner review may still be needed.
#
#      Recommended: If you require approvals, enable "Dismiss stale pull
#      request approvals when new commits are pushed" so changes to the PR
#      diff require fresh approval.
#
#    - If the PR is already mergeable, `gh pr merge --auto --squash` can
#      merge it immediately. Otherwise, auto-merge waits for GitHub's
#      applicable merge requirements to be met.
#
# 6. Settings -> Actions -> Policies:
#    - Starting December 2, 2026, affected public repositories need an applicable
#      Actions event policy that explicitly allows pull_request_target.
#      a. Open the form to create an Actions policy.
#      b. Name the policy "Allow Dependabot pull_request_target".
#      c. Set "Enforcement status" to "Active".
#      d. Under "Target workflows", choose "Add target" and add an include-by-path
#         condition for .github/workflows/dependabot-pr-handling.yaml.
#         Keep this workflow as the only target of the policy.
#      e. Under "Workflow execution protections", enable "Restrict events" and
#         select only pull_request_target. Leave "Restrict actors" and
#         "Require lockfile" unchecked for this policy.
#      f. Create the policy. If the workflow is blocked, check "Policy insights"
#         under Settings -> Actions to identify the blocking policy.
#    - If an applicable policy restricts actors, allow dependabot[bot] for this
#      workflow and the App's bot account for the push-triggered workflows.
#    - https://docs.github.com/en/actions/how-tos/administer/control-workflow-execution
#    - https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
#
# Notes:
# - pull_request_target runs this privileged job from the default branch.
#   Keep PR code checkout and execution in the separate pull_request CI workflow.
# - The built-in GITHUB_TOKEN reads PR validation and submits the approval.
#   GitHub completes the App's auto-merge request when the merge rules are met.
#   The resulting push to build/master triggers the regular build.yml and
#   docker.yml workflows, including Docker image publishing.
# - https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow

name: Dependabot automated PR handling

on: pull_request_target

permissions: {}

concurrency:
  group: dependabot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dependabot-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Check whether the update can be merged automatically
        id: eligibility
        # fetch-metadata uses the ecosystem identifier from the Dependabot branch name.
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Wait for PR validation
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          VALIDATION_WORKFLOW: build.yml
        run: |
          # The pull_request and pull_request_target runs are created independently.
          run_id=""
          for _ in {1..12}; do
            run_id=$(gh api --method GET \
              "repos/$GH_REPO/actions/workflows/$VALIDATION_WORKFLOW/runs" \
              -f event=pull_request -f branch="$PR_HEAD_REF" -f head_sha="$PR_HEAD_SHA" |
              jq -r --arg repo "$GH_REPO" \
                '[.workflow_runs[] | select(.head_repository.full_name == $repo)][0].id // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No $VALIDATION_WORKFLOW validation run found for $PR_HEAD_SHA."
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 15

      - name: Approve the validated commit
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$PR_HEAD_SHA" --silent

      - name: Create a GitHub App token for merging
        if: steps.eligibility.outputs.eligible == 'true'
        id: merge-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable squash auto-merge
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.merge-app-token.outputs.token }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
